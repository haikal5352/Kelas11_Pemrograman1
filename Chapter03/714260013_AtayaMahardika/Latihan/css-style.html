<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Programming</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
        font: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 0;
        }
        h1 {
        color: #333;
        text-align: center;
        margin: 20px 0;
        }
        .article {
        background: #fff;
        padding: 20px;
        margin: 10px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>Selamat Datang di GameZone</h1>
    <div class="article">
        <h2>Review Game Terbaru</h2>
        <p>
        Ulasan lengkap tentang game rilisan terbaru yang sedang ramai dimainkan.
        </p>
    </div>
    <div class="article">
        <h2>Tips dan Trik Bermain</h2>
        <p>Kumpulan strategi untuk membantu kamu naik peringkat dengan cepat.</p>
    </div>
</body>
</html>
