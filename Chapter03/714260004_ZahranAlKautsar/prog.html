<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAtihan Blog programing</title>
    <link rel="stylesheet" href="style.css">
    <script>
        function t(){
            var e = document.getElementById("comments");
            e.style.display = "none" ===e.style.display ? "block" : "none ";
        }
    </script>
</head>
<body>
    <h2>Judul artikel</h2>
    <p>Isi artikel tentang teknologi terbaru.</p>
    <button onclick="t()">Komentar</button>
    <div id="comments" style="display: none">
        <h3>Komentar</h3>
        <p>komntar 1: artikel ini informatif</p>
        <p>komntar 1: Saya suka artikel ini!!!</p>
    </div>
</body>
</html>
