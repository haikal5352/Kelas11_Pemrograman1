<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimaj Zakan Hawada</title>
</head>
<body>
    <h1>Pendaftaran Workshop Desai Grafis</h1>
    <form action="submit.php" method="post">
        <label for="name">Nama Lengkap</label>
        <input for="text" id="name" required />
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br />
        <label for="experience">Pengalaman:</label>
        <input type="radio" id="Beginner" name="experience" value="Beginner" />
        <label type="beginner">Pemula</label>
        <input
            type="radio"
            id="intermediate"
            name="experience"
            value="intermadiate"
        />
        <label for="intermadiate">Menengah</label>
        <input type="radio" id="advanced" name="exverience" value="advanced" />
        <label for="advanced">Mahir</label>

        <label for="comment">Harapan dari workshop:</label><br />
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>

        <input type="submit" value="Daftar" />
    </form>
</body>
</html>
