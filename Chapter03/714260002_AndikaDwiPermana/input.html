<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input</title>
</head>
<body>
    <h1>contoh input pendaftaran</h1>
    <form action="contoh.php" method="post">
        <label for="nama">Nama lengkap:</label>
        <input type="text" id="nama" name="nama" required />
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
        <br />
        <label for="experience">pengalaman:</label>
        <input type="radio" id="beginner" name="experience" value="pemula" />
        <label for="beginner">Pemula</label>
        <input
           type="radio"
            id="intermediate"
            name="experience"
            value="menengah"
        />
        <label for="intermediate">Menengah</label>
        <input type="radio" id="advanced" name="experience" value="lanjutan" />
        <label for="advanced">Lanjutan</label>

        <label for="comment">Harapan dari ketua moonton:</label> <br />
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>

        <input type="submit" value="Kirim" />
    </form>

</body>
</html>
