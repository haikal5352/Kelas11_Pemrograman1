<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input</title>
</head>
<body>
    <h1>Pendaftaran Server Moratel</h1>
    <form action="submit.php" method="post">
        <label for="name">Nama Lengkap:</label>
        <input type= "text" name="name" id="name" required/>
        <br />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required/>
        <br />
        <label for="experience">pengalaman:</label>
        <input type="radio" id="beginner" name="experience" value="beginner"/>
        <label for="beginner">pemula</label>
        <input type="radio" name="experience" id="intermediate" name="experience" value="intermediate"/>
        <label for="intermediate">Menengah</label>
        <input type="radio" id="advanced" name="experience" value="advanced" />
        <label for="advanced">Mahir</label>
<br>
        <label for="comment">Harapan dari moratel</label> <br />
        <textarea name="comment" id="comment" rows="4" cols="50"></textarea>

        <input type="submit" value="Daftar">
    </form>
</body>
</html>
