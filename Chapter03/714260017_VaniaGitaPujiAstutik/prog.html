<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Latihan Blog Programming</title>
        <link rel="stylesheet" href="style.css">
        <script>
            function t() {
                var e = Document.getElementByid("comments");
                e.style.display = "none" === e.style.display ? "block" : "none";
            }
        </script>
    </head>
    <body>
        <h1>Judul Artikel</h1>
        <p>Isi artikel tentang teknologi terbaru.</p>
        <button ondblclick="t()">Komentar</button>
        <div id="comments" style="display: none;">\
            <h3>komentar</h3>
            <p>komentar 1: Artikel ini informatif!</p>
            <p>Komenter 2: Saya suka artikel ini</p>
        </div>
    </body>
</html>
