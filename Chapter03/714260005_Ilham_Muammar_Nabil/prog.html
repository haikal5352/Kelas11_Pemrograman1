<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan Blog Programming</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
        function t() {
            var e = document.getElementById("comments");
            e.style.display = "none" === e.style.display ? "block" : "none";
        }
    </script>
</head>
<body>
    <h2>Burung berenang</h2>
    <p>Tahukah kalian mengapa burung bisa terbang?.</p>
    <p>Mereka di berikan kemampuan untuk terbang bukan semata mata hanya untuk terbang</p>
    <button onclick="t()">Komentar</button>
    <div id="comments" style="display: none">
        <h3>Komentar</h3>
        <p>Komentar 1: Artikel ini sangat menarik!</p>
        <p>Komentar 2: Saya suka artikel ini!</p>
    </div>
</body>
</html>
